[build-system]
requires = ["scikit-build-core>=0.8.0", "pybind11>=2.12.0", "cmake>=3.20", "setuptools>=61", "wheel"]
build-backend = "scikit_build_core.build"

[project]
name = "qasmtrans"
version = "0.0.1"
description = "Python bindings for the QASMTrans quantum transpiler."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "QASMTrans Developers" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pnnl/qasmtrans"

[tool.scikit-build]
cmake.verbose = false
cmake.args = []
